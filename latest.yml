releaseNotes: |-
  "마감" 일정: 굵은 글씨·형광펜만 자동, 칸 색은 그대로
  메모창: 칸 구분 없이 자유롭게 쓰기 — Enter를 누르면 • 와 함께 다음 줄, ✓로 저장 (줄을 고치면 일정 수정, 지우면 삭제, ✓를 붙이면 완료)
  "마감"이 들어간 일정은 자동으로 형광펜·굵게, 그날 칸은 붉은색
  메뉴를 종류별로 묶음 (보기·화면, 일정 정리, 불릿, 사이드바·링크, 휴대폰·고정, 백업·파일, 설정·도움말) — 화면 아래가 잘리지 않게
  구글 문서·시트·슬라이드를 로그인된 계정에서 바로 만들기 (드라이브 권한이 없으면 크롬에서 만들고 주소를 복사하면 자동 연결)
  메모창을 간단하게: 누르면 바로 입력, Enter로 다음 줄, ✓로 닫기, 아래 연필(수정)로 모든 편집 기능
  입력한 순서대로 일정 표시
  내리기(–) 버튼: 머리줄만 남기고 일정 접기
  다른 컴퓨터: 설치 후 구글 로그인만 하면 바로 동기화 (로그인 키 내장)
  동기화 더 빠르게: 창으로 돌아오면 바로, 열려 있는 동안 45초마다 확인
  일정·메모창 줄을 마우스로 끌어 순서 바꾸기·다른 날짜로 옮기기 (더 확실하게)
  사이드바: 평소엔 아이콘만, 마우스를 올리면 펼침
  사이드바 링크를 크롬(내 계정 로그인 프로필)으로 열기
  링크 고치기 창에서 폴더 목록 고르기·새 폴더 만들기
  토·일요일 숨기기
  사이드바에 프로그램·바로가기 끌어다 놓기 (누르면 실행, 아이콘 표시)
  할 일 미루기 (내일·모레·다음 주 월요일·일주일 뒤·날짜 고르기)
  사이드바 쪽지 메모
  사이드바 링크 찾기
  시계 위젯을 누르면 집중 타이머 (25분·5분·수업 끝까지 등)
  사이드바 폴더: 새 폴더 만들기, 이름 바꾸기, 지우기, 열고 닫기, 끌어서 순서 바꾸기, 폴더에 링크 넣기·옮기기
  웹 내보내기: 구글 드라이브에 저장이 기본
  웹 달력 내보내기: 바로 내려받을 수 없는 형식은 구글 드라이브 백업 폴더에 진짜 파일로 저장
  구글 캘린더로 보내기 고침: 요청이 많아 막히면 잠시 기다렸다 다시 보내고, 한 번 막혀도 멈추지 않음. 진행 상황 표시와 멈추기
  저장 조각이 섞여도 최신 저장본만 읽고 남은 조각 정리
  모든 파일 넣기에서 PDF·사진·텍스트 파일 사용 (파일 고르기, 끌어다 놓기, Ctrl+V 붙여넣기)
  학사 일정 붙여넣기에 학사일정표 PDF·사진 넣기
  시계 위젯 디자인 정리(여백 줄이고 글씨 크게, 화면 스타일과 같은 색)
  기본 불릿 = 작은 회색 점
  일정마다 링크 넣기 (일정 옆 링크 버튼)
  검색: 첨부문서만 / 링크 있는 일정만 찾기
  컴퓨터 켜면 자동 실행: 마지막 위치·크기·고정 상태 그대로 복원 (모니터가 늦게 잡혀도 다시 제자리로)
  일정 삭제(×)를 한 번 누르면 바로 삭제, 잘못 지웠으면 Ctrl+Z로 되돌리기 (옮기기·불릿 정리·링크 삭제도 Ctrl+Z)
  시계 위젯을 달력 맨 위(윗부분 왼쪽)로 옮김, 날씨 위젯 없앰
  불릿 없음 = 작은 회색 점 (색 불릿 끄기 = 진회색 점)
  사이드바 위에 시계(아날로그+디지털)와 날씨 위젯 카드 (기온·최고/최저·미세먼지, 지역 바꾸기)
  사이드바: 링크와 묶음을 마우스로 자유롭게 끌어 순서 바꾸기 (다른 묶음으로 옮기기, 묶음 제목 끌어 묶음 순서 바꾸기)
  색 불릿을 꺼도 진회색 점으로 일정 구분
  구글 캘린더 알림과 수업 시간표를 한 줄로 합쳐 윗부분 정리
  주 버튼: 1주·2주·3주·4주·5주·한 달 보기 고르기 (숫자키 1~5, M)
  사이드바 고치기(연필) 버튼을 누르면 링크가 열리지 않고 수정 창이 바로 나오도록 수정
  사이드바 링크를 듀얼 모니터의 다른 모니터에서 열기 (사이드바 위 모니터 버튼으로 켜고 끄기)
  불릿 없음 = 진한 회색 점
  윗부분을 한 줄로 깔끔하게 정리
  위쪽에 현재 시각 크게 표시 (누르면 12/24시간 전환), 위젯에도 시계
  불릿 없음 = 기본 회색 점으로 표시
  왼쪽 링크 사이드바: 폭 끌어 조절, 아이콘만 보기, 내 아티팩트·웹앱 링크 기본 등록
  링크 추가·고치기·지우기·끌어서 순서 바꾸기, 여러 개 붙여넣기
  할 일을 끌어서 순서 바꾸기·다른 날짜의 원하는 자리로 옮기기
  불릿 보이기/숨기기 스위치, 모든 불릿 없음으로(제목 앞 • 기호도 지움), 자동 불릿 다시 켜기
  위치·크기 고정 버튼 (도구 줄·위젯의 자물쇠)
  할 일 입력칸 끝 ★중요 버튼: 굵은 글씨 + 형광펜
  휴대폰에서 쓰기: QR 코드로 휴대폰에서 위젯 화면 바로 열기, 주소 복사, 홈 화면 추가 안내
  구글 연결 후 "이 기기에만 저장"으로 바뀌던 문제 고침
  구글 캘린더로 보내기·가져오기에서 이미 있는 일정은 다시 넣지 않음, 같은 일정은 한 번만 표시
  날짜에 붙은 문서·시트도 완료(✓)·삭제(×)
  수업 시간표: 내 과목만 남기기
  가져온 일정이 하루 앞당겨진 문제 바로잡기 (한 번 누르면 하루 뒤로) + 날짜 한꺼번에 옮기기 메뉴
  엑셀에서 가져올 때 날짜가 하루 어긋나지 않게, 줄 앞 불릿(•) 지우기
  달력 칸의 할 일에 마우스를 올리면 완료(✓)·삭제(×) 버튼, 완료한 일은 줄이 그어지고 맨 아래로
  눈이 편한 화면 스타일 5가지 추가 (세피아 종이·숲·노르딕 그레이·나이트 앰버·솔라 다크)
  시간표 사진에서 빨간 표시한 칸만 내 수업으로 읽기
  할 일 입력 줄이 쓰는 만큼 늘어나고, "+ 줄 추가" 버튼 추가
  내보내기 오류 메시지를 알기 쉽게 고침
  내보내기: 캘린더 파일(.ics)·구글 캘린더 CSV·엑셀(.xlsx)·텍스트(.txt)·백업, 기간 고르기(이번 달·올해·지난 6개월·전체·직접)
  가져오기: 구글 캘린더·아웃룩(.ics/.csv), 바탕화면 캘린더(.txt/.xls/.db), 엑셀 표, 이미 있는 일정은 빼고 넣기
  새 버전을 자동으로 내려받고, 준비되면 다시 시작만 누르면 되도록 바꿈
  공문·메시지 정리 버튼 (웹 달력에서 정리 → 앱에 동기화)
  할 일 입력칸 3줄, 모임·마감·검토·중요 등 10가지 불릿
  모든 기록을 구글 드라이브 "바탕화면 백업" 폴더에 자동 백업 (하루 한 번 + 바뀐 내용이 있으면 6시간마다)
  구글 메일에서 자동 등록된 일정에 봉투 아이콘
  날짜별 구글 문서·시트를 백업 폴더에 만들기
  시간표 사진을 끌어다 놓거나 Ctrl+V로 붙여넣기
  화면 스타일 5가지, 수업 시간표와 3분 전 알림, 일정 자세히 보기, 업데이트 알림
